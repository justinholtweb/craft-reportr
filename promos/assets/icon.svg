<?xml version="1.0" encoding="UTF-8"?>
<!--
  Plugin Store icon. Rounded tile in the plugin's accent, mark in #FEFEFE — the family's shape.

  The mark is a page with a turned corner and three rising bars cut out of it: a report, drawn as
  the thing it produces. One path with fill-rule="evenodd", so the bars are holes rather than a
  second colour, and src/icon-mask.svg is the same path unchanged.

  Mustard #8A750C sits at ~52° — the gap between Weight's amber and Forklift's chartreuse, and the
  one free hue where white still clears 4.5:1.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Reportr">
  <rect x="0" y="0" width="100" height="100" rx="22.44" fill="#8A750C"/>
  <path fill="#FEFEFE" fill-rule="evenodd" d="M30 15H61L77 31V81A4 4 0 0 1 73 85H30A4 4 0 0 1 26 81V19A4 4 0 0 1 30 15Z M35 61H44V76H35Z M47.5 50H56.5V76H47.5Z M60 39H69V76H60Z"/>
</svg>
